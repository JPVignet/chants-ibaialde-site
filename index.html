<div style="text-align:center; margin-top:40px;">

  <button id="downloadBtn"
          style="
            padding:12px 20px;
            font-size:16px;
            border:none;
            border-radius:10px;
            cursor:pointer;
          ">
   Vérifier les chants hors connexion 
 </button>

  <div id="status"
       style="
         margin-top:15px;
         font-size:14px;
         color:#444;
       ">
  </div>

</div>


<p style="font-size:10px;color:#888;text-align:center">
Version du 08-06-2026 - 13h35
</p>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js', {
    updateViaCache: 'none'
  });
}
</script>

<script>

document.addEventListener("DOMContentLoaded", () => {

  const btn = document.getElementById("downloadBtn");
  const bar = document.getElementById("bar");
  const text = document.getElementById("progressText");

  btn.addEventListener("click", async () => {

    console.log("START");

    // test visuel immédiat
    bar.style.width = "10%";
    text.textContent = "Vérification du cache...";

    try {
      const cacheNames = await caches.keys();

      let chants = [];

      for (const name of cacheNames) {
        const cache = await caches.open(name);
        const requests = await cache.keys();

        for (const r of requests) {
          const url = r.url;

          if (
            url.includes("_html/") &&
            url.endsWith(".html") &&
            !url.includes("index.html")
          ) {
            chants.push(url);
          }
        }
      }

      const unique = [...new Set(chants)];

      console.log("CHANTS =", unique.length);

      // animation propre (sans blocage)
      let count = 0;
      const total = 220;

      const interval = setInterval(() => {

        count++;

        let percent = Math.round((count / total) * 100);

        bar.style.width = percent + "%";
        text.textContent = `${count} / ${total} chants`;

        if (count >= unique.length || count >= total) {
          clearInterval(interval);

          bar.style.width = "100%";
          text.textContent = `✓ ${unique.length} chants disponibles hors connexion`;
        }

      }, 15);

    } catch (e) {
      console.error(e);
      text.textContent = "Erreur cache";
    }

  });

});

</script>
