<div style="text-align:center; margin-top:40px;">

  <button id="downloadBtn"
          style="
            padding:12px 20px;
            font-size:16px;
            border:none;
            border-radius:10px;
            cursor:pointer;
          ">
   Vérifier les chants hors connexion 
 </button>

  <div id="status"
       style="
         margin-top:15px;
         font-size:14px;
         color:#444;
       ">
  </div>

</div>


<p style="font-size:10px;color:#888;text-align:center">
Version du 08-06-2026 - 11h5*
</p>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js', {
    updateViaCache: 'none'
  });
}
</script>

<script>

document.getElementById("downloadBtn")
  .addEventListener("click", async () => {

    const status = document.getElementById("status");

    try {
      const keys = await caches.keys();

      let chants = [];

      for (const cacheName of keys) {
        const cache = await caches.open(cacheName);
        const requests = await cache.keys();

        for (const req of requests) {
          const url = req.url;

          // 🎯 uniquement les chants
          if (
            url.includes("_html/") &&
            url.endsWith(".html") &&
            !url.includes("index.html")
          ) {
            chants.push(url);
          }
        }
      }

      // enlever doublons éventuels
      const unique = [...new Set(chants)];

      const total = 225;

      status.textContent =
        `${unique.length} / ${total} chants disponibles hors connexion`;

    } catch (e) {
      console.error(e);
      status.textContent = "Erreur lecture cache";
    }

  });

</script>
