<div style="text-align:center; margin-top:40px;">

  <button id="downloadBtn"
          style="
            padding:12px 20px;
            font-size:16px;
            border:none;
            border-radius:10px;
            cursor:pointer;
          ">
   Vérifier les chants hors connexion 

btn.addEventListener("click", async () => {

  const cacheNames = await caches.keys();

  console.log("=== CACHE LIST ===", cacheNames);

  for (const name of cacheNames) {
    const cache = await caches.open(name);
    const keys = await cache.keys();

    console.log("CACHE:", name, "TAILLE:", keys.length);

    keys.forEach(k => console.log(k.url));
  }

});
 </button>

<div style="width:100%; max-width:400px; margin:20px auto;">

  <div style="background:#ddd; height:18px; border-radius:10px; overflow:hidden;">
    <div id="bar" style="height:100%; width:0%; background:#2d6cdf;"></div>
  </div>

  <div id="progressText" style="text-align:center; margin-top:8px; font-size:14px;">
    Prêt
  </div>

</div>

  <div id="status"
       style="
         margin-top:15px;
         font-size:14px;
         color:#444;
       ">
  </div>

</div>


<p style="font-size:10px;color:#888;text-align:center">
Version du 08-06-2026 - 17h30
</p>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js', {
    updateViaCache: 'none'
  });

  // 🔥 force check updates
  navigator.serviceWorker.ready.then(reg => {
    reg.update();
  });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js', {
    updateViaCache: 'none'
  }).then(reg => {
    reg.update();
  });
}

</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const btn = document.getElementById("downloadBtn");
  const text = document.getElementById("progressText");
  const bar = document.getElementById("bar");

  btn.addEventListener("click", async () => {

    text.textContent = "Vérification en cours...";
    bar.style.width = "20%";

    try {

      // 🔥 on récupère TOUS les caches
      const cacheNames = await caches.keys();

      let allFiles = [];

      for (const name of cacheNames) {
        const cache = await caches.open(name);
        const keys = await cache.keys();
        allFiles = allFiles.concat(keys);
      }

      // 🔥 on filtre les chants
      const chants = allFiles.filter(r =>
        r.url.includes("_html/") &&
        r.url.endsWith(".html")
      );

      console.log("CHANTS TROUVÉS :", chants.length);

      bar.style.width = "100%";
      text.textContent = chants.length + " chants disponibles hors connexion";

    } catch (e) {
      console.error(e);
      text.textContent = "Erreur lors de la vérification";
    }

  });

});
</script>
