<div style="text-align:center; margin-top:40px;">

  <button id="downloadBtn"
          style="
            padding:12px 20px;
            font-size:16px;
            border:none;
            border-radius:10px;
            cursor:pointer;
          ">
   Vérifier les chants hors connexion 
 </button>

       style="
         margin-top:15px;
         font-size:14px;
         color:#444;
       ">
  </div>

</div>


<p style="font-size:10px;color:#888;text-align:center">
Version du 08-06-2026 - 13h10
</p>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js', {
    updateViaCache: 'none'
  });
}
</script>

<script>

const CHANTS = 220; // nombre réel

document.getElementById("downloadBtn")
  .addEventListener("click", async () => {

    const bar = document.getElementById("bar");
    const text = document.getElementById("progressText");

    text.textContent = "Vérification des chants...";

    const cache = await caches.open("chants-cache-v1");

    // on récupère TOUTES les requêtes du cache
    const requests = await cache.keys();

    let chants = requests.filter(r =>
      r.url.includes("_html/") &&
      r.url.endsWith(".html")
    );

    let count = 0;

    for (const req of chants) {

      // simulation progression réelle (lecture + vérification)
      count++;

      let percent = Math.round((count / CHANTS) * 100);

      bar.style.width = percent + "%";
      text.textContent = `${count} / ${CHANTS} chants`;

      // petite pause visuelle (important pour voir la barre)
      await new Promise(r => setTimeout(r, 10));
    }

    bar.style.width = "100%";
    text.textContent = "✓ 220 chants disponibles hors connexion";
  });

</script>
